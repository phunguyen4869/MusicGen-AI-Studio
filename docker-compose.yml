services:
  minimax-ai-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minimax-ai-studio-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
